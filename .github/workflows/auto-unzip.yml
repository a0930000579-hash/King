name: Auto Unzip and Overwrite

on:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 找不到 ZIP"
            exit 1
          fi

          echo "找到 ZIP：$ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Unzip
        shell: bash
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          rm -rf /tmp/unzip
          mkdir -p /tmp/unzip

          unzip -o "$ZIP_FILE" -d /tmp/unzip

          echo "✅ ZIP 解壓完成"

      - name: Protect GitHub Workflows
        shell: bash
        run: |
          # 不允許 ZIP 覆蓋 GitHub Actions
          rm -rf /tmp/unzip/.github/workflows

          echo "✅ 已保護 .github/workflows"

      - name: Copy files and overwrite
        shell: bash
        run: |
          cp -rf /tmp/unzip/. ./

          echo "✅ 同檔名檔案已覆蓋"

      - name: Remove ZIP
        shell: bash
        run: |
          rm -f "${{ steps.zip.outputs.zip_file }}"

          echo "✅ ZIP 已刪除"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ 沒有需要提交的變更"
            exit 0
          fi

          git commit -m "Auto unzip and overwrite files"

          git push origin main
