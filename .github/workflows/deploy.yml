name: ZIP Auto Extract and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: king-deploy
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          echo "Searching for ZIP..."

          ZIP_FILE=$(find . \
            -type f \
            -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP found."
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ZIP: $ZIP_FILE"

          echo "has_zip=true" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Remove old files
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          echo "================================="
          echo "Removing old game files..."
          echo "================================="

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

      - name: Extract ZIP
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          echo "================================="
          echo "Extracting:"
          echo "$ZIP_FILE"
          echo "================================="

          unzip -o "$ZIP_FILE" -d .

          rm -f "$ZIP_FILE"

      - name: Fix nested folder
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          if [ ! -f "index.html" ]; then

            echo "index.html not found in root."

            INDEX_FILE=$(find . \
              -mindepth 2 \
              -type f \
              -name "index.html" \
              ! -path "./.git/*" \
              | head -n 1)

            if [ -n "$INDEX_FILE" ]; then

              INDEX_DIR=$(dirname "$INDEX_FILE")

              echo "Found index.html:"
              echo "$INDEX_FILE"

              shopt -s dotglob nullglob

              FILES=("$INDEX_DIR"/*)

              if [ ${#FILES[@]} -gt 0 ]; then
                mv "${FILES[@]}" .
              fi

              rm -rf "$INDEX_DIR"

            else
              echo "ERROR: index.html was not found."
              exit 1
            fi
          fi

      - name: Check files
        shell: bash
        run: |
          echo "================================="
          echo "Final files:"
          echo "================================="

          ls -la

          echo "================================="

          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "ERROR: index.html missing."
            exit 1
          fi

      - name: Commit extracted files
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto extract ZIP and replace game files"
            git push
          fi

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: extract

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
