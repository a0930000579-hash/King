name: ZIP Auto Extract
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: king-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract all ZIPs (merge, never delete other files)
        shell: bash
        run: |
          set -u
          zips=()
          while IFS= read -r f; do zips+=("$f"); done < <(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './.github/*')
          echo "Found ${#zips[@]} zip file(s)."
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No ZIP to extract. Nothing to do."
            exit 0
          fi
          for z in "${zips[@]}"; do
            echo "=============================="
            echo "Extracting (merge/overwrite): $z"
            echo "=============================="
            unzip -o "$z" -d . || { echo "unzip failed on $z"; exit 1; }
          done

          # If a zip had one wrapper folder, lift its contents to root
          if [ ! -f index.html ]; then
            inner=$(find . -mindepth 2 -type f -name index.html ! -path './.git/*' ! -path './.github/*' | head -n 1 || true)
            if [ -n "$inner" ]; then
              d=$(dirname "$inner")
              echo "Lifting nested folder: $d"
              shopt -s dotglob nullglob
              mv "$d"/* . 2>/dev/null || true
            fi
          fi

          # Remove only the consumed archives (game files are kept)
          find . -type f -iname '*.zip' ! -path './.git/*' ! -path './.github/*' -delete || true

          echo "=== Root after extract ==="
          ls -la
          if [ -f index.html ]; then
            echo "OK: index.html present."
          else
            echo "NOTE: index.html not at root yet (upload game-code.zip too)."
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # IMPORTANT: never let an extracted zip modify workflows.
          # The default GITHUB_TOKEN cannot push changes under .github/ ,
          # which would otherwise reject the whole push.
          git checkout -- .github 2>/dev/null || true
          rm -f .github/workflows/*.zip 2>/dev/null || true

          git add -A
          # Make 100% sure nothing under .github is staged
          git reset -q -- .github 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto extract ZIP(s) and merge game files [skip ci]"
            git push
            echo "Pushed extracted files."
          fi
