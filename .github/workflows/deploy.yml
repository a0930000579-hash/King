name: ZIP Auto Extract and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: king-deploy
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find all ZIPs
        id: zip
        shell: bash
        run: |
          mapfile -t ZIPS < <(find . -type f -iname "*.zip" ! -path "./.git/*" ! -path "./.github/*")
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No ZIP found, nothing to extract."
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${#ZIPS[@]} ZIP file(s):"
            printf '%s\n' "${ZIPS[@]}"
            echo "has_zip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract every ZIP (merge, never delete other files)
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          set -e
          mapfile -t ZIPS < <(find . -type f -iname "*.zip" ! -path "./.git/*" ! -path "./.github/*")
          for z in "${ZIPS[@]}"; do
            echo "================================="
            echo "Extracting (merge/overwrite): $z"
            echo "================================="
            unzip -o "$z" -d .
          done

      - name: Fix nested folder
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          if [ ! -f "index.html" ]; then
            INDEX_FILE=$(find . -mindepth 2 -type f -name "index.html" ! -path "./.git/*" ! -path "./.github/*" | head -n 1)
            if [ -n "$INDEX_FILE" ]; then
              INDEX_DIR=$(dirname "$INDEX_FILE")
              echo "Lifting nested folder: $INDEX_DIR"
              shopt -s dotglob nullglob
              mv "$INDEX_DIR"/* . 2>/dev/null || true
              rmdir "$INDEX_DIR" 2>/dev/null || true
            else
              echo "index.html not at root yet (may arrive with another part)."
            fi
          fi

      - name: Remove consumed ZIPs (keeps all extracted files)
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          find . -type f -iname "*.zip" ! -path "./.git/*" ! -path "./.github/*" -print -delete

      - name: Check files
        shell: bash
        run: |
          echo "================================="
          echo "Final files:"
          echo "================================="
          ls -la
          echo "================================="
          if [ -f "index.html" ]; then
            echo "SUCCESS: index.html exists."
          else
            echo "WARN: index.html missing (upload game-code.zip too)."
          fi

      - name: Commit extracted files
        if: steps.zip.outputs.has_zip == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto extract ZIP(s) and merge game files [skip ci]"
            git push
          fi

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: extract
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
