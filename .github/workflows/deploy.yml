name: ZIP Merge Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: king-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge-extract uploaded ZIPs (never delete other files)
        shell: bash
        run: |
          set -u
          zips=()
          while IFS= read -r f; do zips+=("$f"); done < <(find . -type f -iname '*.zip' ! -path './.git/*' ! -path './.github/*')
          echo "Found ${#zips[@]} NEW zip(s) in this push."
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No new ZIP. Keep current files."
            exit 0
          fi
          # Extract onto EXISTING files (merge/overwrite, nothing is deleted)
          for z in "${zips[@]}"; do
            echo "=============================="
            echo "Merge-extract: $z"
            echo "=============================="
            unzip -o "$z" -d . || { echo "unzip failed on $z"; exit 1; }
          done
          # Lift a single wrapper folder only if index.html ends up nested
          if [ ! -f index.html ]; then
            inner=$(find . -mindepth 2 -type f -name index.html ! -path './.git/*' ! -path './.github/*' | head -n 1 || true)
            if [ -n "$inner" ]; then
              d=$(dirname "$inner")
              echo "Lifting nested folder: $d"
              shopt -s dotglob nullglob
              mv "$d"/* . 2>/dev/null || true
            fi
          fi
          # Remove only the zip(s) just consumed; all extracted files stay
          find . -type f -iname '*.zip' ! -path './.git/*' ! -path './.github/*' -delete || true
          echo "=== asset count so far ==="
          find assets -type f 2>/dev/null | wc -l

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never modify workflows (token cannot push .github)
          git checkout -- .github 2>/dev/null || true
          # Force-add so a stray .gitignore cannot skip assets
          git add -f -A
          git reset -q -- .github 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Merge-extract uploaded ZIP [skip ci]"
            git push
            echo "Merged and pushed."
          fi
