<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>多人連線+戰鬥測試 — 暗黑天堂MMORPG</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#0a0a0c; color:#d8c9a8; font-family:"Microsoft JhengHei",sans-serif; overflow:hidden; }
  #game { position:fixed; inset:0; }
  #hud { position:fixed; top:10px; left:10px; right:10px; display:flex; gap:8px;
         justify-content:space-between; align-items:center; pointer-events:none; z-index:5; }
  .panel { background:rgba(15,12,8,.82); border:1px solid #5a4626; border-radius:8px;
           padding:8px 12px; font-size:13px; pointer-events:auto; }
  #status b { color:#7fd17f; }
  #chatBox { position:fixed; left:10px; bottom:10px; width:min(320px,78vw); z-index:6; }
  #chatLog { height:110px; overflow-y:auto; background:rgba(10,8,6,.78); border:1px solid #4a3a20;
             border-radius:8px 8px 0 0; padding:6px 8px; font-size:12px; line-height:1.5; }
  #chatForm { display:flex; }
  #chatInput { flex:1; background:#15110b; border:1px solid #4a3a20; color:#d8c9a8; padding:8px; font-size:13px; outline:none; }
  #chatForm button { background:#5a4626; border:none; color:#fff; padding:0 14px; }
  #tip { position:fixed; top:58px; left:50%; transform:translateX(-50%); font-size:12px;
         color:#a89878; background:rgba(0,0,0,.5); padding:4px 10px; border-radius:20px; z-index:5; white-space:nowrap; }
  #reward { position:fixed; right:10px; bottom:10px; z-index:6; font-size:13px; line-height:1.7; text-align:right; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel" id="status">狀態：<b>連線中…</b></div>
  <div class="panel">此地圖：<span id="count">0</span> 人 / <span id="mcount">0</span> 怪</div>
</div>
<div id="tip">點空地移動　·　點怪物攻擊（兩個分頁打同隻怪=共享血量）</div>
<div id="chatBox">
  <div id="chatLog"></div>
  <form id="chatForm"><input id="chatInput" maxlength="120" placeholder="聊天…" autocomplete="off"><button>送</button></form>
</div>
<div class="panel" id="reward">經驗：<span id="exp">0</span><br>金幣：<span id="gold">0</span></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let W,H;function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}addEventListener('resize',resize);resize();
const socket=io();
const myName='玩家'+Math.floor(Math.random()*900+100);
const others=new Map(), mon=new Map();
let me={x:1024,y:1024,tx:1024,ty:1024,dir:1},cam={x:0,y:0};
let myExp=0,myGold=0; const floats=[];

socket.on('connect',()=>{document.querySelector('#status b').textContent='已連線';
  socket.emit('join_world',{name:myName,class:'warrior',level:10},()=>socket.emit('enter_map',{mapId:'forest',channel:0}));});
socket.on('disconnect',()=>document.querySelector('#status b').textContent='斷線重連…');

socket.on('map_state',({entities,monsters})=>{
  document.getElementById('count').textContent=entities.length;
  document.getElementById('mcount').textContent=(monsters||[]).length;
  const seen=new Set();
  entities.forEach(e=>{seen.add(e.id);
    if(e.id===socket.id){me.x+=(e.x-me.x)*.3;me.y+=(e.y-me.y)*.3;return;}
    let o=others.get(e.id);if(!o){o={...e};others.set(e.id,o);}
    o.tx=e.x;o.ty=e.y;o.name=e.name;o.dir=e.dir;o.isBot=e.isBot;});
  [...others.keys()].forEach(id=>{if(!seen.has(id))others.delete(id);});
  const mseen=new Set();
  (monsters||[]).forEach(m=>{mseen.add(m.id);let t=mon.get(m.id);
    if(!t){t={...m};mon.set(m.id,t);}t.hp=m.hp;t.maxHp=m.maxHp;t.x=m.x;t.y=m.y;t.name=m.name;});
  [...mon.keys()].forEach(id=>{if(!mseen.has(id))mon.delete(id);});
});
socket.on('monster_damage',d=>{const t=mon.get(d.monsterId);if(t){t.hp=d.hp;
  floats.push({x:t.x,y:t.y-30,txt:(d.crit?'暴擊 ':'')+d.dmg,color:d.by===socket.id?'#ffd24a':'#e08080',life:1});}});
socket.on('monster_killed',d=>{mon.delete(d.monsterId);
  floats.push({x:d.x,y:d.y-20,txt:d.killerName+' 擊殺',color:'#9fff9f',life:1.4});});
socket.on('gain_reward',r=>{myExp+=r.exp||0;myGold+=r.gold||0;
  document.getElementById('exp').textContent=myExp;document.getElementById('gold').textContent=myGold;
  floats.push({x:me.x,y:me.y-40,txt:'+'+r.exp+'EXP'+(r.drop?' 掉落!':''),color:'#7fd17f',life:1.6});});
socket.on('player_left',({id})=>others.delete(id));
socket.on('chat',d=>addChat(d.name,d.text));

function onTap(e){e.preventDefault();const r=cv.getBoundingClientRect();
  const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left, py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const wx=px+cam.x, wy=py+cam.y;
  let target=null,best=60;
  for(const m of mon.values()){const dd=Math.hypot(m.x-wx,m.y-wy);if(dd<best){best=dd;target=m;}}
  if(target){me.tx=target.x;me.ty=target.y+40;me.dir=target.x>=me.x?1:-1;me._target=target.id;}
  else{me._target=null;me.tx=wx;me.ty=wy;me.dir=wx>=me.x?1:-1;}
}
cv.addEventListener('click',onTap);cv.addEventListener('touchstart',onTap,{passive:false});

let lastSend=0,lastAtk=0;
function loop(){
  const sp=4.2,dx=me.tx-me.x,dy=me.ty-me.y,d=Math.hypot(dx,dy);
  if(d>sp){me.x+=dx/d*sp;me.y+=dy/d*sp;}
  if(me._target){const t=mon.get(me._target);
    if(t){const ad=Math.hypot(t.x-me.x,t.y-me.y);
      if(ad<170&&Date.now()-lastAtk>900){lastAtk=Date.now();socket.emit('attack_monster',{monsterId:t.id,skillId:'basic'});}
      else if(ad>=170){me.tx=t.x;me.ty=t.y+40;}} else me._target=null;}
  cam.x+=((me.x-W/2)-cam.x)*.12;cam.y+=((me.y-H/2)-cam.y)*.12;
  const now=Date.now();if(now-lastSend>100){socket.emit('move',{x:me.x,y:me.y,dir:me.dir});lastSend=now;}
  draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(90,70,38,.15)';const gs=80,ox=-cam.x%gs,oy=-cam.y%gs;
  ctx.beginPath();for(let x=ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H);}for(let y=oy;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
  for(const m of mon.values()){const sx=m.x-cam.x,sy=m.y-cam.y;if(sx<-60||sx>W+60)continue;
    ctx.beginPath();ctx.ellipse(sx,sy+16,15,6,0,0,7);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
    ctx.fillStyle='#7a2a2a';ctx.fillRect(sx-12,sy-24,24,30);
    ctx.fillStyle='#d8c9a8';ctx.font='11px sans-serif';ctx.textAlign='center';
    ctx.fillText(m.name+' Lv'+m.level,sx,sy-34);
    ctx.fillStyle='#000';ctx.fillRect(sx-18,sy-30,36,4);
    ctx.fillStyle=m.hp/m.maxHp>.4?'#5fd35f':'#e05050';ctx.fillRect(sx-18,sy-30,36*Math.max(0,m.hp/m.maxHp),4);}
  const list=[...others.values()].sort((a,b)=>a.y-b.y);
  list.forEach(o=>{o.x+=(o.tx-o.x)*.2;o.y+=(o.ty-o.y)*.2;drawP(o,false);});
  drawP(me,true);
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=.016;f.y-=.6;
    if(f.life<=0){floats.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.color;ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.fillText(f.txt,f.x-cam.x,f.y-cam.y);ctx.globalAlpha=1;}
}
function drawP(e,isMe){const sx=e.x-cam.x,sy=e.y-cam.y;if(sx<-60||sx>W+60)return;
  ctx.beginPath();ctx.ellipse(sx,sy+18,16,6,0,0,7);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();
  ctx.fillStyle=isMe?'#4a90e2':(e.isBot?'#8a7aa8':'#c0563a');ctx.fillRect(sx-10*e.dir,sy-26,20,34);
  ctx.fillStyle='#e8c87a';ctx.fillRect(sx+10*e.dir,sy-18,8*e.dir,3);
  ctx.fillStyle=isMe?'#7fb0ff':'#d8c9a8';ctx.font='12px sans-serif';ctx.textAlign='center';
  ctx.fillText((isMe?myName:e.name)+(e.isBot?' [AI]':''),sx,sy-44);}
loop();
function addChat(n,t){const l=document.getElementById('chatLog'),d=document.createElement('div');
  d.innerHTML='<b>'+n+'：</b>'+t.replace(/[<>]/g,'');l.appendChild(d);l.scrollTop=l.scrollHeight;
  while(l.children.length>40)l.removeChild(l.firstChild);}
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();
  const i=document.getElementById('chatInput'),t=i.value.trim();if(!t)return;
  socket.emit('chat',{channel:'world',text:t});addChat(myName,t);i.value='';});
</script>
</body>
</html>
