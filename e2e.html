<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>E2E 測試</title>
<style>
  body { margin: 0; background: #0a0703; color: #ffd880; font-family: sans-serif; }
  #status { position: absolute; top: 0; left: 0; z-index: 99999; padding: 4px 8px;
    background: rgba(0,0,0,0.7); font-size: 10px; color: #fff; pointer-events: none; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div id="status">init...</div>
<iframe id="game" src="/"></iframe>
<script>
const params = new URLSearchParams(location.search);
const step = params.get('step') || 'home';
const charName = params.get('name') || 'E2E';
const charClass = params.get('class') || 'warrior';

const iframe = document.getElementById('game');
let tries = 0;

iframe.addEventListener('load', () => {
  const wait = setInterval(() => {
    tries++;
    if (tries > 120) { clearInterval(wait); setStatus('timeout waiting for AuthSystem'); document.title = 'E2E_TIMEOUT'; return; }
    try {
      const win = iframe.contentWindow;
      if (!win || !win.AuthSystem) return;
      clearInterval(wait);
      runStep(win);
    } catch (e) { setStatus('err: '+e.message); }
  }, 200);
});

function setStatus(s) {
  document.getElementById('status').textContent = s;
}

function runStep(win) {
  const AuthSystem = win.AuthSystem;
  const doc = win.document;

  switch (step) {
    case 'home':
      document.title = 'E2E_home_DONE';
      break;

    case 'register':
      AuthSystem.show();
      setTimeout(() => {
        // 找到 switchView 函式
        const viewFn = win.__switchView || AuthSystem.__switchView;
        if (viewFn) viewFn('register');
        else {
          // 用按鈕導航
          const homeStart = doc.querySelector('.auth-hero-btn');
          if (homeStart) homeStart.click();
        }
        document.title = 'E2E_register_DONE';
      }, 300);
      break;

    case 'char_create':
      (async () => {
        try {
          const acc = 'e2ecc_' + Date.now().toString(36).slice(-6);
          await AuthSystem.api('/auth/register', { account: acc, password: 'test1234' });
          const login = await AuthSystem.api('/auth/login', { account: acc, password: 'test1234' });
          try {
            win.localStorage.setItem('mmo_token', login.token);
            win.localStorage.setItem('mmo_account', acc);
          } catch(e) {}
          // 設定 server
          if (win.__setCurrentServer) win.__setCurrentServer({ id: 'zeus', name: '宙斯' });
          if (win.__switchView) win.__switchView('charCreate');
          document.title = 'E2E_charCreate_DONE';
        } catch (e) {
          setStatus('FAIL: ' + e.message);
          document.title = 'E2E_charCreate_FAIL';
        }
      })();
      break;

    case 'in_game':
      (async () => {
        try {
          const acc = 'e2eg_' + Date.now().toString(36).slice(-6);
          await AuthSystem.api('/auth/register', { account: acc, password: 'test1234' });
          const login = await AuthSystem.api('/auth/login', { account: acc, password: 'test1234' });
          try {
            win.localStorage.setItem('mmo_token', login.token);
            win.localStorage.setItem('mmo_account', acc);
          } catch(e) {}
          await AuthSystem.api('/characters/create', {
            name: charName, classId: charClass, server: 'zeus',
          });
          if (win.__setCurrentServer) win.__setCurrentServer({ id: 'zeus', name: '宙斯' });
          try {
            win.localStorage.setItem('mmo_new_char', JSON.stringify({
              name: charName, classId: charClass, level: 1, exp: 0,
              created: true, createdAt: Date.now(), serverId: 'zeus',
            }));
          } catch(e) {}
          AuthSystem.hide();
          // 等 startGame 可用
          let t2 = 0;
          const i2 = setInterval(() => {
            t2++;
            if (t2 > 100) { clearInterval(i2); document.title = 'E2E_noStartGame'; return; }
            if (typeof win.startGame === 'function') {
              clearInterval(i2);
              try { win.startGame(); } catch(e) { setStatus('startGame err: '+e.message); }
              // 等 init 完成
              setTimeout(() => {
                const bg = doc.getElementById('scene-bg');
                const bgStyle = bg ? win.getComputedStyle(bg).backgroundImage : '';
                const player = doc.querySelector('.world-unit.hero');
                const npcs = doc.querySelectorAll('.npc-unit').length;
                const monsters = doc.querySelectorAll('.world-unit.monster').length;
                const locationName = doc.getElementById('location-name')?.textContent || '';
                const authHidden = doc.getElementById('auth-overlay')?.classList.contains('hidden');
                const ieb = doc.getElementById('init-error-box');
                const ieShown = ieb && win.getComputedStyle(ieb).display !== 'none';
                const mini = doc.getElementById('minimap-canvas');
                const result = {
                  authHidden,
                  hasBg: bgStyle && bgStyle !== 'none' && bgStyle.length > 20,
                  bgLen: bgStyle.length,
                  hasPlayer: !!player,
                  playerName: player?.querySelector('.unit-name')?.textContent || '',
                  npcCount: npcs,
                  monsterCount: monsters,
                  hasMinimap: !!mini,
                  locationName,
                  initErrorShown: ieShown,
                };
                setStatus(JSON.stringify(result));
                document.title = 'E2E_inGame_DONE';
              }, 4000);
            }
          }, 200);
        } catch (e) {
          setStatus('FAIL: ' + e.message);
          document.title = 'E2E_inGame_FAIL';
        }
      })();
      break;
  }
}
</script>
</body>
</html>
